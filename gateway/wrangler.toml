name = "hoodfi-gateway"
main = "./src/index.ts"
compatibility_date = "2024-03-19"

# Left true deliberately. HoodfiL1Resolver.url() on mainnet still points at
# hoodfi-gateway.dmpay.workers.dev, and changing it costs a mainnet transaction, so the
# workers.dev hostname has to keep answering for as long as any client — or any cached
# resolution — still uses it. A custom domain ADDS a hostname here; it never retires one.
workers_dev = true

# ccip.hoodfi.name would have been the better home for this, but hoodfi.name is on
# Vercel's nameservers and a Worker custom domain requires the zone to be in this
# Cloudflare account. hoodfi-mcp.com already is, so this costs one deploy instead of a
# nameserver migration of the live site.
#
# The point of moving off workers.dev at all: the gateway URL is baked into a mainnet
# resolver, so every move of it is an onchain write. On a hostname we control, a future
# origin change is a DNS edit instead.
#
# custom_domain = true serves the WHOLE worker here, not just /v1/* — routing in
# src/index.ts is path-only and never looks at the hostname, so /rpc, /site, /partner and
# /avatar answer on this name too. That is the same code already public on workers.dev,
# not new exposure; splitting the CCIP path into its own worker is the fix if that ever
# needs to stop being true.
[[routes]]
pattern = "ccip.hoodfi-mcp.com"
custom_domain = true


# The funnel sink postEvent writes to. Without this binding env.ANALYTICS is
# undefined and postEvent accepts every event and discards it — silently, by
# design, so analytics can never break the page. That silence hid the fact that
# nothing had ever been recorded, so the binding is declared here rather than
# left to the dashboard.
# `binding` is the name the Worker code sees and must stay ANALYTICS — postEvent
# reads env.ANALYTICS. `dataset` is the name on Cloudflare's side, created in the
# dashboard; the two are unrelated and only the dataset has to match over there.
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "HoodFi_Names"

[vars]
# ROBINHOOD_RPC_URL is deliberately NOT declared here. It is a secret
# (`wrangler secret put ROBINHOOD_RPC_URL`) because it carries an API key, and a
# plain var of the same name would shadow that secret on every deploy. The public
# endpoint it used to hold is now the built-in fallback in src/chains.ts.
L2_REGISTRY_ADDRESS = "0xf2bABA012244bdD7445129597350054E1B3aEe5C"
# HoodfiSites — read to confirm a pinned site was paid for. A plain var, not a
# secret: it is a public address and the site lists it for anyone to check.
SITES_ADDRESS = "0x90517237F52caC977398CA1391b3B006bA028c99"
# Public information, so a plain var — only the RPC URL behind it is secret.
DONATIONS_DEPLOY_BLOCK = "25698544"

# Where /partner delivers. A var rather than a secret: it is a destination, not a
# credential, and having it in the repo is what makes it reviewable. RESEND_API_KEY is
# the secret half and is deliberately NOT declared here — a plain var of that name
# would shadow the secret and revert it on every deploy.
PARTNER_NOTIFY_TO = "hector@rwa-id.com"
# Must be on the exact verified Resend domain. `mail.onchain-id.id` is verified;
# `onchain-id.id` is a different domain to Resend and would be rejected.
PARTNER_FROM = "HoodFi Names <partners@mail.onchain-id.id>"

# Nightly at 03:10 UTC. Phase one of publishing pins before payment by necessity —
# someone has to see the finished site before buying it — so abandoned drafts have to be
# cleaned up by something. Only touches pins this worker made, marked unpaid, older than
# a day; see sweepUnpaidSites.
[triggers]
crons = ["10 3 * * *"]
