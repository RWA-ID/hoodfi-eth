name = "hoodfi-mcp"
main = "./src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# `true` is already the default, but it is written out because the line below it is
# exactly what tempts someone to turn it off. An MCP endpoint is not a link people
# follow — it is a string copied into a client's own config file — so every agent that
# connected before hoodfi-mcp.com existed still holds hoodfi-mcp.dmpay.workers.dev/mcp,
# in a file this repo cannot reach and cannot migrate. Dropping the subdomain would
# disconnect all of them at once, and nothing here would report an error. The custom
# domains are an addition, never a replacement.
workers_dev = true

# The two hostnames the site advertises. Both existed as dashboard-created Custom
# Domains before they were written here; declaring them keeps the worker reproducible
# if it is ever rebuilt from scratch, which the dashboard alone does not.
#
# `custom_domain` and a plain route are different things: a custom domain creates the
# DNS record and provisions the certificate itself, while a route needs a proxied
# record to already exist. Each hostname is its own entry — the apex does not imply
# `www` and `www` does not imply the apex.
routes = [
  { pattern = "hoodfi-mcp.com", custom_domain = true },
  { pattern = "www.hoodfi-mcp.com", custom_domain = true },
]

[observability]
enabled = true

[vars]
# ROBINHOOD_RPC_URL is deliberately NOT declared here. It is a secret
# (`wrangler secret put ROBINHOOD_RPC_URL`) because it carries an API key, and a
# plain var of the same name would shadow that secret on every deploy — it would
# also revert the secret each time, silently. The public endpoints stay as the
# built-in fallback in src/chain.ts, so losing the secret degrades rather than fails.
#
# SET 2026-08-17: this worker's own paid Alchemy key — deliberately NOT the gateway's,
# so the two can be rotated independently and Alchemy's dashboard shows which service is
# spending what. Sharing one key couples the blast radius: rotating it would take down
# resolution, name cards, vouchers and the agent tools together. Same reason the gateway has one —
# public RPCs throttle Workers hard, because every Cloudflare colo shares a small
# pool of egress IPs and the rate limiter sees one very busy caller. Measured on
# this worker before and after, resolving the same name: 29/30 then 60/60, median
# 180ms. The key must stay unrestricted: a Worker's fetch sends no Origin and no
# Referer, so an origin allowlist rejects it and there is no URL you can add to fix
# that. Nothing echoes a raw error here (safeMessage in tools.ts, literal strings in
# mcp.ts) because a viem error embeds the whole transport URL, key included.
REGISTRAR_ADDRESS = "0x56be5565acc823f4195c2cf3b9046C083633209a"
L2_REGISTRY_ADDRESS = "0xf2bABA012244bdD7445129597350054E1B3aEe5C"
USDG_ADDRESS = "0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168"
